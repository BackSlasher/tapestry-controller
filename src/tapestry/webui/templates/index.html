{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0">Screen Layout</h5>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-primary btn-sm" id="restore-image">
                        <i class="bi bi-arrow-clockwise"></i> Restore Last Image
                    </button>
                    <button type="button" class="btn btn-outline-warning btn-sm" id="clear-screens">
                        Clear All Screens
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div class="text-center">
                    <canvas id="layout-canvas" class="border" style="max-width: 100%; height: auto;"></canvas>
                    <div class="mt-2">
                        <small class="text-muted">Current layout with <span id="device-count">{{ device_count }}</span> device(s)</small>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-header">
                <h5 class="card-title mb-0">
                    <button class="btn btn-link p-0 text-decoration-none collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#device-info-collapse" aria-expanded="false" aria-controls="device-info-collapse">
                        <i class="bi bi-chevron-right"></i> Device Information
                    </button>
                </h5>
            </div>
            <div class="collapse" id="device-info-collapse">
                <div class="card-body">
                    <div id="device-info">
                        <div class="d-flex justify-content-center">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <!-- Screensaver Controls -->
        <div class="card mb-3">
            <div class="card-header py-2 d-flex justify-content-between align-items-center">
                <h6 class="card-title mb-0"><i class="bi bi-images"></i> Screensaver</h6>
                <span id="screensaver-status-badge"></span>
            </div>
            <div class="card-body py-2">
                <!-- When OFF -->
                <div id="screensaver-off" class="d-none">
                    <div class="d-flex gap-2 align-items-center">
                        <button type="button" class="btn btn-success btn-sm flex-grow-1" id="start-screensaver-home">
                            <i class="bi bi-play-fill"></i> Start
                        </button>
                        <a href="{{ url_for('curation_page') }}" class="btn btn-outline-secondary btn-sm" title="Configure">
                            <i class="bi bi-gear"></i>
                        </a>
                    </div>
                </div>
                <!-- When ON -->
                <div id="screensaver-on" class="d-none">
                    <div class="d-flex gap-2 mb-2">
                        <button type="button" class="btn btn-outline-info btn-sm flex-grow-1" id="next-image-home">
                            <i class="bi bi-skip-forward-fill"></i> Next
                        </button>
                        <button type="button" class="btn btn-outline-warning btn-sm flex-grow-1" id="dislike-image-home">
                            <i class="bi bi-hand-thumbs-down"></i> Dislike
                        </button>
                        <button type="button" class="btn btn-outline-danger btn-sm" id="stop-screensaver-home">
                            <i class="bi bi-stop-fill"></i>
                        </button>
                    </div>
                    <small class="text-muted" id="screensaver-position"></small>
                </div>
            </div>
        </div>

        <div class="card" id="upload-card">
            <div class="card-header">
                <h5 class="card-title mb-0">Send Image</h5>
            </div>
            <div class="card-body position-relative">
                <!-- Disabled overlay when screensaver is active -->
                <div id="upload-disabled-overlay" class="position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center d-none" style="background: rgba(255,255,255,0.8); z-index: 10;">
                    <div class="text-center text-muted">
                        <i class="bi bi-images" style="font-size: 2rem;"></i>
                        <div class="mt-2">Stop screensaver first</div>
                    </div>
                </div>
                <!-- Upload Form -->
                <form id="upload-form" action="{{ url_for('upload_image') }}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="image-input" class="form-label">Select Image</label>
                        <div id="drop-zone" class="border border-2 border-dashed rounded p-4 text-center position-relative" style="min-height: 120px; transition: all 0.3s ease;">
                            <input type="file" class="form-control position-absolute opacity-0 w-100 h-100" id="image-input" name="image" accept="image/*" required style="cursor: pointer;">
                            <div id="drop-zone-content" class="pointer-events-none">
                                <i class="bi bi-cloud-upload text-muted" style="font-size: 2rem;"></i>
                                <div class="mt-2">
                                    <span class="text-muted">Drag & drop, paste, or <strong>click to browse</strong></span>
                                </div>
                                <div class="mt-1">
                                    <small class="text-muted">PNG, JPG, GIF, BMP, TIFF • Max 16MB</small>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary" id="upload-btn">
                            <span class="spinner-border spinner-border-sm" style="display: none;" id="upload-spinner"></span>
                            Send to Displays
                        </button>
                    </div>
                </form>
            </div>
        </div>


    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='homepage.js') }}"></script>
{% endblock %}
